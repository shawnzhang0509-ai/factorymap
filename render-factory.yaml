# Blueprint for factorymap.online backend (China Factory Map legacy).
# Deploy separately from the MBTI service on main.
# Docs: deploy/factorymap-online.md

services:
  - type: web
    name: factorymap-factory
    runtime: python
    branch: factory-map-legacy
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: factorymap-factory-db
          property: connectionString

databases:
  - name: factorymap-factory-db
    plan: free
